# cargo-deny policy for lymaille. Run by `scripts/check` (step "dependencies").
# Permissive licences only; a new licence is a decision of the lead developer, not a line to add silently.

[graph]
all-features = true

[advisories]
# Unmaintained crates reached only through dependencies we do not control. Each exception names its path. Reviewed on
# 2026-11-01 ahead of the 0.1 publication: one exception left (the `serde_yaml` one went with vynil-core 0.9.1, 2026-11-12), temporarily accepted, decision of the lead developer
# (lymaille.sdd #3, lymaille.sdd #1).
ignore = [
  { id = "RUSTSEC-2026-0249", reason = "smartstring is unmaintained; pulled by rhai 1.27.0, no alternative short of replacing rhai; still accepted for now, temporarily accepted on 2026-11-01 (lymaille.sdd #1)" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  # No-attribution MIT, used by borrow-or-share (jsonschema > referencing > fluent-uri). Allowed by the lead developer, 2026-10-30.
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "Unicode-3.0",
  # File-level weak copyleft, used as is (no modification) by smartstring, a dependency of rhai.
  "MPL-2.0",
  # Permissive, used by ring and rustls-webpki (rmcp > reqwest > rustls). Allowed by the lead developer, 2026-10-30.
  "ISC",
  # Permissive data licence of the root certificates in webpki-root-certs (rmcp > reqwest). Allowed by the lead developer, 2026-10-30.
  "CDLA-Permissive-2.0",
]

[bans]
# Duplicate crates are already refused by clippy (`cargo::multiple_crate_versions`, allowed-duplicate-crates in clippy.toml).
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
