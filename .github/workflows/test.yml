---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # The whole harness of the project, as a developer runs it (`scripts/check`): fmt, clippy, tests, clippy for each feature
  # alone, rustdoc, coverage floor and cargo-deny. CI never sets `SKIP`.
  check:
    name: Harness (scripts/check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain (version and components) comes from `rust-toolchain.toml`.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: scripts/check
        run: scripts/check

  # Controls the `.sdd` specs with the official SpecDD tool. Pinned version: `lint` evolves with the tool (Node >= 22).
  specs:
    name: Specs (specdd lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install SpecDD CLI
        run: npm install --global specdd@1.2.0

      - name: specdd lint
        run: specdd lint
