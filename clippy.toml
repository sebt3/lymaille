# Tighter thresholds than the defaults.
too-many-lines-threshold = 80
too-many-arguments-threshold = 5
cognitive-complexity-threshold = 15
excessive-nesting-threshold = 4
type-complexity-threshold = 150
max-fn-params-bools = 2
max-struct-bools = 2

# New crate: lints that suggest a public API change stay active.
avoid-breaking-exported-api = false

# Tests may fail loudly.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

doc-valid-idents = ["Rhai", "MCP", "SpecDD", "Handlebars", "OpenAI", "..", "vLLM", "llama.cpp"]

# `syn` appears twice in the graph, inherently: `rhai_codegen` (a dependency of `rhai` 1.27.0) uses `syn` 2, while
# `serde_derive` and `thiserror` use `syn` 3. Not a mistake to fix in this crate. See `dsd/agent-sessions.md`, Open Issues.
allowed-duplicate-crates = [
  "syn",
  # `cpufeatures` 0.2 (sha2, via vynil-core's sha256) and 0.3 (chacha20, via vynil-core's rand 0.10): temporary, inherent to
  # vynil-core 0.9.0, tracked by https://github.com/vynil-org/vynil-core/issues/36.
  "cpufeatures",
  # `getrandom` 0.2 (const-random, via rhai's ahash), 0.3 (ahash) and 0.4 (vynil-core's rand 0.10): temporary, inherent to
  # vynil-core 0.9.0, tracked by https://github.com/vynil-org/vynil-core/issues/36.
  "getrandom",
  # `r-efi` 5 (getrandom 0.3, via rhai's ahash) and 6 (getrandom 0.4, via vynil-core's rand 0.10): uefi target only in the
  # graph, temporary, inherent to vynil-core 0.9.0, tracked by https://github.com/vynil-org/vynil-core/issues/36.
  "r-efi",
]

# Architecture constraints of the design, enforced by the compiler.
# Each exception is a `#[expect(clippy::disallowed_methods, reason = "...")]` at the single permitted place.
disallowed-methods = [
  # CON-1: the library performs no storage I/O; it defines traits that the host implements.
  { path = "std::fs::read", reason = "CON-1: no storage I/O, go through a trait" },
  { path = "std::fs::read_to_string", reason = "CON-1: no storage I/O, go through a trait" },
  { path = "std::fs::write", reason = "CON-1: no storage I/O, go through a trait" },
  { path = "std::fs::read_dir", reason = "CON-1: no storage I/O, go through a trait" },
  { path = "std::fs::create_dir_all", reason = "CON-1: no storage I/O, go through a trait" },
  { path = "std::fs::remove_file", reason = "CON-1: no storage I/O, go through a trait" },
  { path = "std::fs::File::open", reason = "CON-1: no storage I/O, go through a trait" },
  { path = "std::fs::File::create", reason = "CON-1: no storage I/O, go through a trait" },
  # allow-invalid: tokio's fs items exist only with the `fs` feature, which this crate does not enable.
  { path = "tokio::fs::read", reason = "CON-1: no storage I/O, go through a trait", allow-invalid = true },
  { path = "tokio::fs::read_to_string", reason = "CON-1: no storage I/O, go through a trait", allow-invalid = true },
  { path = "tokio::fs::write", reason = "CON-1: no storage I/O, go through a trait", allow-invalid = true },
  # CON-3: the library never reads the process environment (secrets).
  { path = "std::env::var", reason = "CON-3: never read the process environment" },
  { path = "std::env::var_os", reason = "CON-3: never read the process environment" },
  { path = "std::env::vars", reason = "CON-3: never read the process environment" },
  { path = "std::env::vars_os", reason = "CON-3: never read the process environment" },
  # NFR-1: testable without a real clock; time goes through an injected trait.
  { path = "std::time::SystemTime::now", reason = "NFR-1: inject a clock" },
  { path = "std::time::Instant::now", reason = "NFR-1: inject a clock" },
  # No blocking wait outside cancellation points.
  { path = "std::thread::sleep", reason = "blocks a thread with no cancellation point (FR-4)" },
]
disallowed-types = [
  { path = "std::process::Command", reason = "CON-1: the library never spawns a process" },
  # allow-invalid: tokio's process items exist only with the `process` feature, which this crate does not enable.
  { path = "tokio::process::Command", reason = "CON-1: the library never spawns a process", allow-invalid = true },
  { path = "std::net::TcpStream", reason = "CON-5: connections go through the HTTPS client" },
  { path = "std::os::unix::net::UnixStream", reason = "CON-5: no local transport" },
]
